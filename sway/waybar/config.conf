{
  "layer": "top",
  "position": "top",
	"spacing": 4,
  "height": 24,
  "margin-bottom": 0,
  "margin-top": 0,
  "modules-left": [
    "sway/workspaces",
		"sway/scratchpad",
  ],
  "modules-center": [
		"clock",
  ],
  "modules-right": [
		"cpu",
		"memory",
		"network",
		"wireplumber",
    "custom/mic",
    "tray",
  ],
	"sway/scratchpad": {
		"format": "{icon} {count}",
		"show-empty": false,
		"format-icons": ["", ""],
		"tooltip": true,
		"tooltip-format": "{app}: {title}"
	},
	"clock": {
    "timezone": "America/Sao_Paulo",
    "tooltip": false,
    "format": "{:%A %d de %b %H:%M}",
    "locale": "pt_BR.UTF-8",
    "interval": 1
  },
	"cpu": {
    "format": "<span foreground='#4c7899'>cpu:</span> {usage}%",
	},
	"memory": {
    "format": "<span foreground='#4c7899'>ram:</span> {percentage}%",
    "max-length": 10,
    "warning": 70,
    "critical": 90
	},
	"network": {
		"format": "<span foreground='#4c7899'>󰩠</span> {ipaddr}"
	},
	"wireplumber": {
		"format": "<span foreground='#4c7899'>{icon}</span> {volume}%",
		"format-muted": "",
    "format-icons": [""],
	},
  "custom/mic": {
    "exec": "~/.config/waybar/mic_vol.sh",
    "interval": 1,
    "tooltip": true
  },
	"tray": {
    "icon-size": 16,
    "spacing": 6
  },
}
