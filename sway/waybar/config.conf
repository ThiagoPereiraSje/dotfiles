{
  "layer": "top",
  "position": "top",
	"spacing": 2,
  "height": 24,
  "margin-bottom": 0,
  "margin-top": 0,
  "modules-left": [
    "sway/window"
  ],
  "modules-center": [
    "sway/workspaces"
  ],
  "modules-right": [
    "tray",
		"cpu",
		"memory",
		"network",
		"sway/language",
		"wireplumber",
		"clock"
  ],
  "tray": {
    "icon-size": 16,
    "spacing": 6
  },
	"cpu": {
    "format": "󰒔 {usage}%",
	},
	"memory": {
    "format": "󰴿 {used:0.2f}GB",
    "max-length": 10,
    "warning": 70,
    "critical": 90
	},
	"network": {
		"format": "󰀂 {ipaddr}"
	},
	"sway/language": {
    "format": " {short}"
	},
	"wireplumber": {
		"format": " {volume}%",
		"format-muted": "󰝟",
	}
}
