{
  "layer": "top",
  "position": "top",
	"spacing": 4,
  "height": 24,
  "margin-bottom": 0,
  "margin-top": 0,
  "modules-left": [
    "sway/workspaces",
		"sway/scratchpad",
  ],
  "modules-center": [
		"custom/datetime",
  ],
  "modules-right": [
		"custom/cpu",
    "custom/separator",
		"custom/mem",
    "custom/separator",
		"wireplumber",
    "custom/separator",
    "custom/mic",
    "custom/separator",
    "tray",
  ],
	"sway/scratchpad": {
		"format": "{icon} {count}",
		"show-empty": false,
		"format-icons": ["", ""],
		"tooltip": true,
		"tooltip-format": "{app}: {title}"
	},
	"wireplumber": {
		"format": "<span>VOL:</span> {volume}%",
    "format-muted": "<span>VOL:</span> Off",
	},
  "custom/cpu": {
    "exec": "~/.config/waybar/wl_cpu.py",
    "interval": 5,
    "return-type": "json"
  },
  "custom/mem": {
    "exec": "~/.config/waybar/wl_mem.py",
    "interval": 5,
    "return-type": "json"
  },
  "custom/datetime": {
    "exec": "~/.config/waybar/wl_datetime.py",
    "interval": 60
  },
  "custom/mic": {
    "exec": "~/.config/waybar/wl_mic.py",
    "interval": 1
  },
  "custom/separator": {
    "format": "|",
    "interval": "once",
    "tooltip": false
  },
	"tray": {
    "icon-size": 16,
    "spacing": 6
  },
}
