{
  "layer": "top",
  "position": "top",
	"spacing": 14,
  "height": 24,
  "margin-bottom": 0,
  "margin-top": 0,
  "modules-left": [
    "sway/workspaces"
  ],
  "modules-center": [
		"clock"
  ],
  "modules-right": [
		"bluetooth",
		"cpu",
		"memory",
		"network",
		"wireplumber",
    "tray",
  ],
  "tray": {
    "icon-size": 16,
    "spacing": 6
  },
	"cpu": {
    "format": "<span foreground='#4c7899'>CPU:</span> {usage}%",
	},
	"memory": {
    "format": "<span foreground='#4c7899'>RAM:</span> {percentage}%",
    "max-length": 10,
    "warning": 70,
    "critical": 90
	},
	"network": {
		"format": "<span foreground='#4c7899'>IP:</span> {ipaddr}"
	},
	"bluetooth": {
    "format": "󰂲",
    "format-on": "{icon}",
    "format-off": "{icon}", 
    "format-connected":"{icon}",
    "format-icons":{
        "on":"󰂯",
        "off": "󰂲",
        "connected": "󰂱",
        },
    "on-click": "blueman-manager",
    "tooltip-format-connected":"{device_enumerate}"
  },
	"wireplumber": {
		"format": "<span foreground='#4c7899'></span> {volume}%",
		"format-muted": "<span foreground='#4c7899'>󰝟</span>",
	},
	"clock": {
    "timezone": "America/Sao_Paulo",
    "tooltip": false,
    "format": "{:%A %d de %b %H:%M}",
    "interval": 1
  },
}
