{
  "layer": "top",
  "position": "top",
	"spacing": 4,
  "height": 24,
  "margin-bottom": 0,
  "margin-top": 0,
  "modules-left": [
    "sway/workspaces",
		"sway/scratchpad",
  ],
  "modules-center": [
		"clock",
  ],
  "modules-right": [
		"bluetooth",
		"cpu",
		"memory",
		"network",
		"wireplumber",
    "tray",
  ],
	"sway/scratchpad": {
		"format": "{icon} {count}",
		"show-empty": false,
		"format-icons": ["", ""],
		"tooltip": true,
		"tooltip-format": "{app}: {title}"
	},
	"clock": {
    "timezone": "America/Sao_Paulo",
    "tooltip": false,
    "format": "{:%A %d de %b %H:%M}",
    "interval": 1
  },
	"bluetooth": {
    "format": "",
    "format-on": "{icon}",
    "format-off": "{icon}", 
    "format-connected":"{icon}",
    "format-icons":{
      "on":"",
      "off": "󰂲",
      "connected": "󰂰",
    },
    "on-click": "blueman-manager",
    "tooltip-format-connected":"{device_enumerate}"
  },
	"cpu": {
    "format": "<span foreground='#4c7899'>󰻠</span> {usage}%",
	},
	"memory": {
    "format": "<span foreground='#4c7899'></span> {percentage}%",
    "max-length": 10,
    "warning": 70,
    "critical": 90
	},
	"network": {
		"format": "<span foreground='#4c7899'>󰩠</span> {ipaddr}"
	},
	"wireplumber": {
		"format": "<span foreground='#4c7899'></span> {volume}%",
		"format-muted": "<span foreground='#4c7899'></span> {volume}%",
		"on-click": "pavucontrol",
	},
	"tray": {
    "icon-size": 16,
    "spacing": 6
  },
}
