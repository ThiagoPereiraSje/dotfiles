{
  "layer": "top",
  "position": "top",
	"spacing": 14,
  "height": 24,
  "margin-bottom": 0,
  "margin-top": 0,
  "modules-left": [
    "sway/language"
  ],
  "modules-center": [
    "sway/workspaces"
  ],
  "modules-right": [
    "tray",
		"cpu",
		"memory",
		"network",
		"wireplumber",
		"clock"
  ],
  "tray": {
    "icon-size": 16,
    "spacing": 6
  },
	"cpu": {
    "format": "<span foreground='#4c7899'>CPU:</span> {usage}%",
	},
	"memory": {
    "format": "<span foreground='#4c7899'>RAM:</span> {percentage}%",
    "max-length": 10,
    "warning": 70,
    "critical": 90
	},
	"network": {
		"format": "<span foreground='#4c7899'>IP:</span> {ipaddr}"
	},
	"sway/language": {
    "format": "<span foreground='#4c7899'></span> {short}"
	},
	"wireplumber": {
		"format": "<span foreground='#4c7899'></span> {volume}%",
		"format-muted": "<span foreground='#4c7899'>󰝟</span>",
	}
}
