separator=true
separator_block_width=10

# Data
[date]
command=~/.local/bin/i3datetime.py
interval=once
color=#ccc

# Janelas minimizadas
[scratchpad]
command=~/.local/bin/scratchpad
interval=1

# CPU
[cpu]
command=~/.local/bin/i3cpu.py
interval=1
markup=pango

# RAM
[memory]
command=~/.local/bin/i3mem.py
interval=1
markup=pango

# Volume
[vol]
command=~/.local/bin/i3vol.py
interval=1
color=#ccc

# Microfone
[mic]
command=~/.local/bin/i3mic.py
interval=1
color=#ccc
