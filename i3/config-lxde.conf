# i3 config file (v4)
# Please see https://i3wm.org/docs/userguide.html for a complete reference!


# Configurações padrão
#####################################
set $mod Mod4
set $terminal "lxterminal"
set $app_launcher "rofi -show drun -show-icons"
set $file_manager "pcmanfm"

font pango:Ubuntu Bold 9
default_border pixel 1
default_floating_border pixel 1
gaps inner 2


# wokspaces
#####################################
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"


# Cores da janela
#####################################
# class                   border    backgr.   text      indicator   child_border
client.focused          #4c7899 #285577 #ffffff #2e9ef4   #285577
client.focused_inactive #333333 #5f676a #ffffff #484e50   #5f676a
client.unfocused        #333333 #222222 #888888 #292d2e   #222222
client.urgent           #2f343a #900000 #ffffff #900000   #900000
client.placeholder      #000000 #0c0c0c #ffffff #000000   #0c0c0c

client.background       #ffffff


# Barra de tarefas
#####################################
bar {
  position top
  output primary
  tray_output primary
  
  colors {
    background #000000
    statusline #ffffff
    separator  #666666

    focused_workspace  #4c7899 #285577 #ffffff
    active_workspace   #333333 #5f676a #ffffff
    inactive_workspace #111111 #222222 #888888
    urgent_workspace   #2f343a #900000 #ffffff
    binding_mode       #2f343a #900000 #ffffff
  }

  status_command i3blocks
}


# Autostart de componentes úteis do mate
#####################################

# Compositor e plano de fundo
exec --no-startup-id picom

# Plano de fundo
exec --no-startup-id feh --bg-fill $HOME/.local/wallpapers/w02.jpg

# Deixar o monitor em inatividade em 4 minutos
exec --no-startup-id xset s 240
exec --no-startup-id xset s blank
exec --no-startup-id xset s -dpms

# Definir o som do microfone
exec --no-startup-id sh -c 'sleep 2 && amixer set Capture nocap'


# Configurações de janelas
#####################################
for_window [class="Blueman-manager"] floating enable, resize set 800 600, move position center
for_window [class="Alarm-clock-applet"] floating enable
for_window [class="Lxterminal"] floating enable, resize set 1300 600, move position center
for_window [window_type="dialog"] floating enable


# Teclas de atalho
#####################################

# recarregar o arquivo de configuração
bindsym $mod+Shift+c reload

# reiniciar o i3
bindsym $mod+Shift+r restart

# desligar o computador
bindsym $mod+Shift+q exec ~/.local/bin/powermenu

bindsym $mod+Return exec $terminal
bindsym $mod+d exec $app_launcher
bindsym $mod+f exec $file_manager

# fechar a janela selecionada
bindsym $mod+q kill

# mudar o foco da janela
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# mover a janela selecionada
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# split in horizontal orientation
bindsym $mod+h split h

# split in vertical orientation
bindsym $mod+v split v

# enter fullscreen mode for the focused container
bindsym $mod+Shift+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
# bindsym $mod+s layout stacking
# bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle

# move tiling windows via drag & drop by left-clicking into the title bar,
# or left-clicking anywhere into the window while holding the floating modifier.
tiling_drag modifier titlebar

# Minimizar / maximizar janelas
bindsym $mod+Shift+m move scratchpad
bindsym $mod+m scratchpad show

# redimensionar janelas
bindsym $mod+Ctrl+Left resize shrink width 20px
bindsym $mod+Ctrl+Right resize grow width 20px
bindsym $mod+Ctrl+Up resize shrink height 10px
bindsym $mod+Ctrl+Down resize grow height 10px

# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4

# volume
bindsym $mod+F9  exec amixer set Master playback toggle
bindsym $mod+F10 exec amixer set Master playback 5%-
bindsym $mod+F11 exec amixer set Master playback 5%+

# microfone
bindsym $mod+Shift+F9 exec amixer set Capture cap toggle
bindsym $mod+Shift+F10 exec amixer set Capture 5%-
bindsym $mod+Shift+F11 exec amixer set Capture 5%+

# print da tela
bindsym $mod+Shift+p exec maim -s ~/Imagens/screenshot-$(date +%Y%m%d-%H%M%S).png